name: ZPL Print Manager CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: ./scripts/test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portable-test-results
          path: artifacts/test-results
          if-no-files-found: error
  windows-build:
    needs: portable-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore ZplPrintManager.slnx --locked-mode
      - run: dotnet build ZplPrintManager.slnx -c Release --no-restore
      - name: Resolve version
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $version = $Matches[1] } else { $version = "0.1.${{ github.run_number }}" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - if: matrix.arch == 'x64'
        run: dotnet test ZplPrintManager.slnx -c Release --no-build --filter 'Category!=WindowsVM' --logger trx --results-directory artifacts/test-results/windows
      - name: Publish self-contained binaries
        run: ./scripts/publish.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }}
      - name: Provision verified Inno Setup compiler
        run: ./scripts/install-inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3')
      - name: Build test installer
        run: |
          $compiler = $env:ISCC_PATH
          if (!$compiler -or !(Test-Path -LiteralPath $compiler)) { throw 'Verified Inno Setup compiler missing.' }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $compiler "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" installer/ZplPrintManager.iss 2>&1 | Tee-Object -FilePath artifacts/installer/compiler.log
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          # ISCC.exe ProductVersion can be 0.0.0.0; read the actual compiler engine banner.
          $compilerLog = Get-Content artifacts/installer/compiler.log -Raw
          if ($compilerLog -notmatch 'Compiler engine version:[^\r\n]*\b6\.4\.3\b') {
            throw 'Compiler engine did not report the pinned version 6.4.3.'
          }
          '6.4.3' | Out-File artifacts/installer/compiler-version.txt
      - name: Record dependencies and SHA-256
        run: |
          dotnet list ZplPrintManager.slnx package --include-transitive --format json | Out-File artifacts/dependencies.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inventory failed.' }
          dotnet --info | Out-File artifacts/sdk.txt
          git rev-parse HEAD | Out-File artifacts/commit.txt
          Get-ChildItem artifacts/publish,artifacts/installer -Recurse -File | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | Export-Csv artifacts/checksums.csv -NoTypeInformation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.arch == 'x64'
        with:
          name: windows-test-results
          path: artifacts/test-results/windows
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zpl-print-manager-win-${{ matrix.arch }}-test-build
          path: |
            artifacts/publish
            artifacts/installer
            artifacts/dependencies.json
            artifacts/sdk.txt
            artifacts/commit.txt
            artifacts/checksums.csv
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zpl-print-manager-win-*-test-build
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in x64 x86; do
            cp "dist/zpl-print-manager-win-$arch-test-build/checksums.csv" "checksums-$arch.csv"
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*/installer/ZplPrintManager-*.exe checksums-x64.csv checksums-x86.csv
